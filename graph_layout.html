<style>
  #mynetwork { max-width: 100%; box-sizing: border-box; }
  #mynetwork #loadingBar {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200, 200, 200, .8);
  }
  #mynetwork #loadingBar[hidden] { display: none; }
  #loadingBar .graph-loading-progress {
    display: flex; align-items: center; gap: .75rem;
    width: min(600px, 90%); padding: .5rem; box-sizing: border-box;
    background: #fcfcfc; border: 8px solid rgba(0, 0, 0, .1); border-radius: 2rem;
  }
  #loadingBar progress { flex: 1; min-width: 0; width: 0; }
  #loadingBar output { font: 18px system-ui, sans-serif; color: #000; }
  #graph-physics-control {
    position: absolute; top: 12px; right: 12px; z-index: 11;
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border: 1px solid rgba(15, 23, 42, .12); border-radius: 24px;
    background: rgba(255, 255, 255, .94); color: #334155;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .12); backdrop-filter: blur(8px);
    font: 500 13px system-ui, sans-serif; cursor: pointer; user-select: none;
  }
  #graph-physics {
    appearance: none; position: relative; width: 32px; height: 18px; margin: 0;
    border: 0; border-radius: 12px; background: #64748b; cursor: pointer;
  }
  #graph-physics::before {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
  }
  #graph-physics:checked { background: #0072BB; }
  #graph-physics:checked::before { transform: translateX(14px); }
  #graph-physics:focus-visible { outline: 2px solid #0072BB; outline-offset: 4px; }
</style>
<label id="graph-physics-control" title="Pause or resume graph motion">
  Physics <input id="graph-physics" type="checkbox" role="switch">
</label>
<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";
  const pane = document.getElementById("mynetwork");
  pane.append(document.getElementById("graph-physics-control"));
  const physics = document.getElementById("graph-physics");
  physics.checked = graphData.options.physics?.enabled !== false;
  physics.addEventListener("change", () => {
    network.setOptions({physics: {enabled: physics.checked}});
  });
  network.on("configChange", changes => {
    if (changes.physics?.enabled !== undefined) physics.checked = changes.physics.enabled;
  });
  // Start hidden: disabled physics/stabilization and empty graphs may emit no progress.
  const overlay = document.createElement("div");
  overlay.id = "loadingBar";
  overlay.hidden = true;
  overlay.innerHTML = '<div class="graph-loading-progress">' +
    '<progress max="1" value="0" aria-label="Graph layout progress"></progress>' +
    '<output>0%</output></div>';
  pane.append(overlay);
  const bar = overlay.querySelector("progress");
  const label = overlay.querySelector("output");
  network.on("stabilizationProgress", event => {
    const fraction = event.total > 0 ? Math.min(1, Math.max(0, event.iterations / event.total)) : 1;
    bar.value = fraction;
    label.textContent = Math.round(fraction * 100) + "%";
    overlay.hidden = false;
  });
  const hide = () => { overlay.hidden = true; };
  network.on("stabilizationIterationsDone", hide);
  network.on("stabilized", hide);
});
</script>
